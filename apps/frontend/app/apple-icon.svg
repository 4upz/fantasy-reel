<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b23a"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Solid dark background for Apple icon -->
  <rect width="180" height="180" fill="#0f0f0f"/>

  <!-- Film reel outer ring -->
  <circle cx="90" cy="90" r="65" fill="none" stroke="url(#goldGradient)" stroke-width="8"/>

  <!-- Center hub -->
  <circle cx="90" cy="90" r="16" fill="url(#goldGradient)"/>

  <!-- Film sprocket holes (4 around the reel) -->
  <circle cx="90" cy="45" r="11" fill="url(#goldGradient)"/>
  <circle cx="135" cy="90" r="11" fill="url(#goldGradient)"/>
  <circle cx="90" cy="135" r="11" fill="url(#goldGradient)"/>
  <circle cx="45" cy="90" r="11" fill="url(#goldGradient)"/>

  <!-- Diagonal sprocket holes for reel effect -->
  <circle cx="122" cy="58" r="8" fill="url(#goldGradient)" opacity="0.85"/>
  <circle cx="122" cy="122" r="8" fill="url(#goldGradient)" opacity="0.85"/>
  <circle cx="58" cy="122" r="8" fill="url(#goldGradient)" opacity="0.85"/>
  <circle cx="58" cy="58" r="8" fill="url(#goldGradient)" opacity="0.85"/>
</svg>
