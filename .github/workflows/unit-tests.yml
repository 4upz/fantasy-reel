name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Scripts, Edge Function units, and Discord bot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: '2.6.4'

      - name: Install dependencies
        run: npm ci

      - name: Test local testing scripts
        run: npm run test:scripts

      - name: Test shared Edge Function units
        if: ${{ !cancelled() }}
        run: npm run test:functions:unit

      - name: Test Discord bot
        if: ${{ !cancelled() }}
        run: npm run test:bot
