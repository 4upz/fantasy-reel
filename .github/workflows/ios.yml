name: iOS

on:
  pull_request:
    # labeled: adding the ios-screenshots label commits fresh screenshots.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    # The Xcode 27 image (macOS 27, Apple Silicon); macos-26 stops at Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 75
    permissions:
      # Only the labeled screenshot step writes (to the PR's own branch).
      contents: write
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Built with the iOS 27.1 SDK so the app fills iPhone Duo's screens and
      # gets its side-mounted bars (docs/IOS-DUO-PLAN.md). The app still runs
      # on iOS 26. Picks the newest Xcode 27.1+ on the image, never an older one.
      - name: Select Xcode 27.1 or newer
        run: |
          # Every Xcode on the image with its version; a release beats a
          # release candidate, betas are never used.
          XCODE=$(for app in /Applications/Xcode*.app; do
              v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null) || continue
              echo "$v $app"
            done | tee /dev/stderr | python3 -c 'import sys
          found=[]
          for line in sys.stdin:
              v,p=line.split(" ",1); p=p.strip()
              if "beta" in p.lower(): continue
              n=tuple(int(x) for x in (v.split(".")+["0","0"])[:3])
              if n >= (27,1,0): found.append(("candidate" not in p.lower(), n, p))
          print(max(found)[2] if found else "")')
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 27.1 or newer on this runner image"; exit 1; fi
          case "$XCODE" in *[Cc]andidate*) echo "::warning::Using a release candidate: $XCODE" ;; esac
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          import re
          ver=lambda k: tuple(int(x) for x in re.search(r"iOS-(\d+)-(\d+)", k).groups())
          ios=sorted((kv for kv in d.items() if re.search(r"iOS-2\d-\d+", kv[0])), key=lambda kv: ver(kv[0]))
          for k,v in reversed(ios):
              for dev in v:
                  if dev["name"].startswith("iPhone") and "Duo" not in dev["name"]:
                      print(dev["udid"]); sys.exit()')
          if [ -z "$UDID" ]; then echo "::error::No iPhone simulator on an iOS 26+ runtime"; xcrun simctl list devices available; exit 1; fi
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project FantasyReel.xcodeproj -scheme FantasyReel

      - name: Build the app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project FantasyReel.xcodeproj \
            -scheme FantasyReel \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log

      - name: Test FantasyReelKit
        working-directory: apps/ios/Packages/FantasyReelKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme FantasyReelKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ../../build/FantasyReelKit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee -a ../../build/xcodebuild.log

      # Fixed screens (FantasyReel/App/ScreenshotScenes.swift) in light and
      # dark, for reviewers. Uploaded as the ios-screenshots artifact.
      - name: Capture screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          scripts/capture-screenshots.sh "$UDID" \
            build/DerivedData/Build/Products/Debug-iphonesimulator/FantasyReel.app build/screenshots
          ls build/screenshots

      # With the ios-screenshots label (or a manual run), the same scenes on
      # iPhone Duo's outer (closed) screen, in dark mode, as duo-outer-*.png.
      # The inner screen can't be captured here yet: no command-line way to
      # open the simulated Duo has been found (docs/IOS-DUO-PLAN.md, 0.4).
      - name: Capture iPhone Duo screenshots
        if: >-
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'ios-screenshots')
        run: |
          set -euo pipefail
          DUO=$(xcrun simctl list devices available --json | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          for k,v in d.items():
              for dev in v:
                  if dev["name"]=="iPhone Duo": print(dev["udid"]); sys.exit()')
          if [ -z "$DUO" ]; then
            RUNTIME=$(xcrun simctl list runtimes --json | python3 -c 'import json,sys
          rs=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r["isAvailable"]]
          rs=[r for r in rs if tuple(map(int,r["version"].split(".")))>=(27,1)]
          print(max(rs,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"] if rs else "")')
            if [ -z "$RUNTIME" ]; then echo "::error::No iOS 27.1 simulator runtime for iPhone Duo"; exit 1; fi
            DUO=$(xcrun simctl create "iPhone Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$RUNTIME")
          fi
          echo "iPhone Duo: $DUO"
          xcrun simctl boot "$DUO" || true
          xcrun simctl bootstatus "$DUO" -b
          scripts/capture-screenshots.sh "$DUO" \
            build/DerivedData/Build/Products/Debug-iphonesimulator/FantasyReel.app build/screenshots \
            --display outer --appearances dark
          xcrun simctl shutdown "$DUO" || true

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-screenshots
          path: apps/ios/build/screenshots
          if-no-files-found: error

      # With the ios-screenshots label on a PR from this repo, commit smaller
      # copies to the PR branch so the description can show them. Pushes made
      # with GITHUB_TOKEN don't start another run.
      - name: Commit screenshots to the PR branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'ios-screenshots')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -f build/screenshots/blank-screenshots.txt ]; then
            echo "::error::Not committing: these screenshots stayed blank: $(tr '\n' ' ' < build/screenshots/blank-screenshots.txt)"
            exit 1
          fi
          DEST=docs/screenshots
          rm -rf "$DEST" && mkdir -p "$DEST"
          for f in build/screenshots/*.png; do
            sips --resampleWidth 600 "$f" --out "$DEST/$(basename "$f")" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          git add "$DEST"
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "iOS: update PR screenshots"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$HEAD_REF"

      - name: Summarize errors
        if: failure()
        run: |
          echo "### Compiler errors"
          grep -E "error:" build/xcodebuild.log | sort -u | head -200 || true
          echo "### Failed tests"
          grep -E "✘|failed|Test .* recorded an issue" build/xcodebuild.log | head -100 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-results
          path: |
            apps/ios/build/xcodebuild.log
            apps/ios/build/FantasyReelKit.xcresult
          if-no-files-found: ignore
