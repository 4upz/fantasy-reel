name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    # Tests run against a production build (see the Build step below), so the
    # suite is compile-free at test time. Healthy runs finish well under 15 min
    # including the ~2-3 min build; 25 catches a truly hung run early.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          # Pinned so upstream CLI behavior changes are deliberate diffs, not
          # silent breakage (version: latest broke CI when the CLI flipped
          # [api].auto_expose_new_tables — see supabase/cli#5524). Bump on purpose.
          version: 2.111.0

      - name: Start Supabase
        # The CLI intermittently 502s while the stack is coming up
        # ("An invalid response was received from the upstream server"),
        # which used to fail the whole run in ~5 min. Retry a couple of
        # times with a clean stop in between before giving up.
        run: |
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            fi
            echo "supabase start failed (attempt ${attempt}); retrying..."
            supabase stop --no-backup || true
            sleep 15
          done
          echo "supabase start failed after 3 attempts"
          exit 1

      - name: Get Supabase keys and set environment
        id: supabase-keys
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')" >> $GITHUB_ENV
          SERVICE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          echo "::add-mask::$SERVICE_KEY"
          echo "service-role-key=$SERVICE_KEY" >> $GITHUB_OUTPUT

      - name: Reset database
        # Same intermittent-502 hazard as supabase start; the reset is
        # idempotent, so retrying is safe.
        run: |
          for attempt in 1 2 3; do
            if supabase db reset --no-seed; then
              exit 0
            fi
            echo "supabase db reset failed (attempt ${attempt}); retrying..."
            sleep 15
          done
          echo "supabase db reset failed after 3 attempts"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend

      # Build a production bundle so tests run against `next start` instead of
      # a dev server. `next dev` compiles routes on first hit, and 4 parallel
      # workers hammering an uncompiled app on a 4-vCPU runner is what caused
      # the 30s page.goto timeouts, 22-28 min runs, and most of the flakes.
      # NEXT_PUBLIC_* vars are inlined at build time and were exported to
      # GITHUB_ENV by the "Get Supabase keys" step above.
      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        working-directory: apps/frontend
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-keys.outputs.service-role-key }}

      # Reports are only uploaded on failure and expire quickly: uploading
      # every run (plus failure videos) exhausted the account's artifact
      # storage quota, which itself started failing runs.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 3

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-artifacts
          path: apps/frontend/test-results/
          retention-days: 3
