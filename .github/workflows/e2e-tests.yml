name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    # Database, API, and browser suites run sequentially on this fresh runner.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 26.7.0 corrupts Playwright 1.58.1 trace finalization locally.
          # Pin the verified runner; do not disable traces to hide that failure.
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          # Pinned so upstream CLI behavior changes are deliberate diffs, not
          # silent breakage (version: latest broke CI when the CLI flipped
          # [api].auto_expose_new_tables — see supabase/cli#5524). Bump on purpose.
          version: 2.111.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '2.6.4'

      - name: Prepare isolated verification environment
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          node --version
          deno --version
          supabase --version
          # `start` applies all migrations to an empty runner database. Disable
          # only optional development seeds; there is no existing DB to reset.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/config.toml')
          config = path.read_text()
          section, tail = config.split('[db.seed]', 1)
          seed, rest = tail.split('[realtime]', 1)
          assert 'enabled = true' in seed
          path.write_text(section + '[db.seed]' + seed.replace('enabled = true', 'enabled = false', 1) + '[realtime]' + rest)
          PY
          # Cache-only movie handlers still require a nonempty provider key.
          # This inert value cannot authorize live TMDb calls. No production
          # provider, Discord, email, or monitoring secrets enter this runner.
          echo 'TMDB_API_KEY=ci-cache-only-placeholder' > supabase/functions/.env

      - name: Start Supabase
        # Stop on an unhealthy start; do not reset or repeatedly retry it.
        run: supabase start

      - name: Get Supabase keys and set environment
        id: supabase-keys
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')" >> $GITHUB_ENV
          SERVICE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          echo "::add-mask::$SERVICE_KEY"
          echo "service-role-key=$SERVICE_KEY" >> $GITHUB_OUTPUT

      - name: Verify stack health and HTTP contracts
        timeout-minutes: 3
        run: node scripts/check-draft-stack.cjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-keys.outputs.service-role-key }}

      - name: Verify database integrity
        run: supabase test db

      - name: Run draft state and bot regressions
        run: |
          npm run test:draft:state
          npm run test:bot
          npm run build --workspace=apps/discord-bot

      - name: Run API integration tests
        timeout-minutes: 15
        # The task expects this ignored file; credentials come from the same
        # local CI stack environment already used by the browser tests below.
        run: |
          touch .env.test
          deno task test:unit
          deno task test --reporter=tap
        working-directory: supabase/functions
        env:
          SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-keys.outputs.service-role-key }}

      # Cache the browser bundle so most runs skip the CDN download entirely.
      # Keyed on the installed Playwright version so upgrades refresh it.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: apps/frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The install intermittently hangs (browser CDN download or apt) — one
      # run sat for 21 minutes until the job timeout killed it. Bound each
      # attempt with `timeout` and retry instead of letting it eat the job.
      # On cache hit only the OS deps step runs (the runner image already has
      # most of them, but Playwright may need a few extras).
      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            install_cmd="npx playwright install-deps chromium"
          else
            install_cmd="npx playwright install --with-deps chromium"
          fi
          for attempt in 1 2 3; do
            if timeout 300 $install_cmd; then
              exit 0
            fi
            echo "playwright install failed or hung (attempt ${attempt}); retrying..."
            sleep 10
          done
          echo "playwright install failed after 3 attempts"
          exit 1
        working-directory: apps/frontend

      # Build a production bundle so tests run against `next start` instead of
      # a dev server. `next dev` compiles routes on first hit, and 4 parallel
      # workers hammering an uncompiled app on a 4-vCPU runner is what caused
      # the 30s page.goto timeouts, 22-28 min runs, and most of the flakes.
      # NEXT_PUBLIC_* vars are inlined at build time and were exported to
      # GITHUB_ENV by the "Get Supabase keys" step above.
      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Verify browser runner and stack before browser tests
        run: |
          npx playwright test --config=scripts/playwright-preflight/playwright.config.cjs
          trace=$(find verification/runner -name trace.zip -print -quit)
          test -n "$trace"
          unzip -t "$trace"
          node scripts/check-draft-stack.cjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-keys.outputs.service-role-key }}

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium --workers=2 --retries=0 --trace=on
        working-directory: apps/frontend
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-keys.outputs.service-role-key }}

      - name: Record sanitized verification summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = Path('apps/frontend/test-results.json')
          commit = Path('verification/commit.txt')
          summary = {'commit': commit.read_text().strip() if commit.exists() else None, 'browser_suite_executed': report.exists()}
          if report.exists():
              data = json.loads(report.read_text())
              summary['stats'] = {key: data['stats'].get(key) for key in ['expected', 'unexpected', 'flaky', 'skipped', 'duration']}
          # Emit counts and state only. Raw logs/inspect output can contain
          # credentials or payloads and must not enter this summary.
          ids = subprocess.check_output(['docker', 'ps', '-aq', '--filter', 'name=supabase_edge_runtime'], text=True).split()
          summary['edge_runtime'] = []
          for container in ids:
              state = json.loads(subprocess.check_output(['docker', 'inspect', container], text=True))[0]['State']
              logs = subprocess.run(['docker', 'logs', container], capture_output=True, text=True)
              combined = (logs.stdout + logs.stderr).lower()
              summary['edge_runtime'].append({
                  'status': state['Status'], 'oom_killed': state['OOMKilled'], 'exit_code': state['ExitCode'],
                  'cpu_hard_limit_events': combined.count('cpu time hard limit'),
                  'worker_acquisition_timeouts': combined.count('worker acquisition timed out'),
              })
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY

      # Reports are only uploaded on failure and expire quickly: uploading
      # every run (plus failure videos) exhausted the account's artifact
      # storage quota, which itself started failing runs.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 3

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-artifacts
          path: apps/frontend/test-results/
          retention-days: 3
