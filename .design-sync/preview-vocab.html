<!--
  Preview layout vocabulary — a safelist, not a component.

  Tailwind compiles utilities by scanning source files, and the compile runs
  BEFORE preview .tsx files are authored (and before parallel authoring waves
  add new ones). Any utility a preview uses that appears nowhere else in the
  app would silently compile to nothing, and the card would render unstyled.

  Listing the allowed preview-layout vocabulary here guarantees every class in
  it exists in styles.css no matter when a preview starts using it. Preview
  authors: use these for card layout glue, plus any class that already appears
  in the app's own components. Add to this file rather than inventing new ones.
-->
