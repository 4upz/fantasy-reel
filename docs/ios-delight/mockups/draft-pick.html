<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../ios-duo/mockups/kit.css"><link rel="stylesheet" href="delight.css"><style>
.live{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 "DM Sans";color:var(--success)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.20)}
.clock{background:var(--success-tint);border-radius:22px;padding:16px;box-shadow:inset 0 0 0 1px rgba(34,197,94,.20)}
.clock.idle{background:var(--surface);box-shadow:none}
.clock .top{display:flex;align-items:center;gap:12px}.clock .top .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.board .mrow+.mrow::before{left:106px}
.pane.sunken .grp{background:#222}.pane.sunken .seg{background:#222}.pane.sunken .seg .on{background:#363636}
.pane.sunken.fade::after{background:linear-gradient(rgba(20,20,20,0),#141414);height:64px}
.pane>*{flex:none}.phd{display:flex;align-items:center;justify-content:space-between;padding-left:4px}
.wrap{zoom:.74}
.pressed{transform:scale(.94);background:var(--gold)!important;color:#0f0f0f!important}
.ghost{opacity:.28}
.fly{position:absolute;z-index:70;width:54px;height:81px;border-radius:8px;transform:rotate(-9deg);box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14)}
.trail-dot{position:absolute;z-index:65;border-radius:6px;background:#4a2f22}
.landed{box-shadow:inset 0 0 0 2px var(--gold);border-radius:14px;background:rgba(201,162,39,.12)}
.slot{width:36px;height:54px;border-radius:5px;border:1.5px dashed rgba(201,162,39,.7);flex:none}
</style></head><body><div class="shot col" id="s"></div>
<script>
const board=(f)=>`
  <div class="pane l fade">
    <div class="hd"><div class="t-meta one">Office Movie Club · 2027 Season</div><div class="t-large">Draft</div><div class="row"><span class="badge b-draft">Drafting</span><span class="live">Live</span></div></div>
    ${f<3?`<div class="clock"><div class="top"><span class="av lg a4">RD</span><div class="txt"><div class="t-card">You're on the clock</div><div class="t-meta">Round 2 · Pick 9 of 30</div></div></div></div>`
    :`<div class="clock idle"><div class="top"><span class="av lg a2">KS</span><div class="txt"><div class="t-card">Dave is on the clock</div><div class="t-meta">Round 2 · Pick 10 of 30 · You're up again at pick 16</div></div><i data-i="check" style="color:var(--success)"></i></div></div>`}
    <div class="sec"><span class="t-section">Round 2</span><span class="t-meta">Picks 7–12</span></div>
    <div class="grp board">
      <div class="mrow"><span class="rank">2.1</span><span class="poster p1">M2</span><div class="mid"><div class="t-row one">Minecraft 2</div><div class="t-meta one">Jul 23, 2027 · Box Office Poison</div></div></div>
      <div class="mrow"><span class="rank">2.2</span><span class="poster p8">MT</span><div class="mid"><div class="t-row one">Man of Tomorrow</div><div class="t-meta one">Jul 9, 2027 · Final Cut Pros</div></div></div>
      ${f==1?`<div class="mrow sel"><span class="rank">2.3</span><span class="av a4">RD</span><div class="mid"><div class="t-row one">Reel Deal</div><div class="t-meta one">Alice Spielberg · <span class="cs">on the clock</span></div></div></div>`
       :f==2?`<div class="mrow sel"><span class="rank">2.3</span><span class="slot"></span><div class="mid"><div class="t-row one c2">The Legend of Zelda</div><div class="t-meta one">Saving your pick…</div></div></div>`
       :`<div class="mrow landed"><span class="rank cg">2.3</span><span class="poster p3">LZ</span><div class="mid"><div class="t-row one">The Legend of Zelda</div><div class="t-meta one">May 7, 2027 · <span class="cg">Reel Deal · your pick</span></div></div></div>`}
      <div class="mrow ${f==3?'sel':''}"><span class="rank">2.4</span><span class="av a0">KS</span><div class="mid"><div class="t-row one">Kubrick's Cube</div><div class="t-meta one">Dave Kubrick · ${f==3?'<span class="cs">on the clock</span>':'up next'}</div></div></div>
      <div class="mrow"><span class="rank">2.5</span><span class="av a0">CC</span><div class="mid"><div class="t-row one">Coppola Cut</div><div class="t-meta one">Carol Coppola</div></div></div>
    </div>
  </div>`;
const row=(p,i,t,m,c='',b='')=>`<div class="mrow ${c}"><span class="poster ${p}">${i}</span><div class="mid"><div class="t-row one">${t}</div><div class="t-meta one">${m}</div></div><span class="btn tinted sm ${b}">Pick</span></div>`;
const picker=(f)=>`
  <div class="pane r sunken fade">
    <div class="phd"><span class="t-panel">Choose a Movie</span><div class="gbtn glass"><i data-i="filter"></i></div></div>
    <div class="field glass"><i data-i="search" style="width:19px;height:19px"></i><span class="one">Search movies</span></div>
    <div class="seg"><span class="on">All</span><span>Trending</span><span>Soon</span><span>Wishlist</span></div>
    <div class="grp">
      ${f==1?row('p3','LZ','The Legend of Zelda','May 7, 2027 · Adventure','','pressed'):f==2?row('p3','LZ','The Legend of Zelda','May 7, 2027 · Adventure','ghost'):''}
      ${row('p2','SW','Star Wars: Starfighter','May 28, 2027 · Science Fiction')}${row('p5','FI','Frozen III','Nov 24, 2027 · Animation')}${row('p8','GX','Godzilla x Kong: Supernova','Mar 26, 2027 · Action')}${row('p6','M3','Minions 3','Jul 1, 2027 · Animation')}${row('p8','TS','Toy Story 5','Jun 19, 2027 · Animation')}${f==3?row('p1','SM','Spider-Man: Brand New Day 2','Jul 30, 2027 · Action'):''}
    </div>
  </div>`;
const extra={1:'<span class="callout" style="left:640px;top:246px">Tap Pick · light tap</span>',
 2:'<span class="trail-dot" style="left:420px;top:262px;width:30px;height:45px;opacity:.16;transform:rotate(-5deg)"></span><span class="trail-dot" style="left:346px;top:300px;width:38px;height:57px;opacity:.3;transform:rotate(-7deg)"></span><span class="fly poster p3" style="left:250px;top:330px"></span><span class="callout dark" style="left:318px;top:420px">Poster travels to its slot · 0.35 s</span>',
 3:'<span class="callout" style="left:258px;top:406px">Lands with a gold ring · success tap</span>'};
const caps={1:['1 · Choose','You press Pick. The button answers at once (it shrinks slightly and fills gold) and the phone gives a light tap, before the server replies.'],
 2:['2 · Travel','The poster lifts out of the list and crosses to your slot on the board. The row it left fades. This is the same poster view moving, so your eye follows the pick to where it now lives.'],
 3:['3 · Land','It settles with a gold ring that fades after a second, one success tap, and the clock card hands over to the next drafter. If the save fails, the poster goes back and an error shows. With Reduce Motion: steps 2 and 3 become a cross-fade, taps unchanged.']};
document.getElementById('s').innerHTML=[1,2,3].map(f=>`<div class="frame" style="flex-direction:row;align-items:center;gap:24px"><div class="wrap"><div class="device open"><div class="statusbar"><span>9:41</span><span class="sys"><span class="batt"></span></span></div><div class="fold"></div>
 <div class="rail"><div class="gbtn glass" style="width:52px"><span class="av round a4" style="width:34px;height:34px">OM</span></div><div class="gbtn glass"><i data-i="bell"></i></div><div class="gbtn glass"><i data-i="more"></i></div><div class="grow"></div><div class="vtabs glass"><div class="vtab"><i data-i="home"></i>Home</div><div class="vtab on"><i data-i="draft"></i>Draft</div><div class="vtab"><i data-i="roster"></i>Roster</div></div></div>
 ${board(f)}${picker(f)}${extra[f]}</div></div><div class="cap" style="max-width:300px"><b>${caps[f][0]}</b>${caps[f][1]}</div></div>`).join('');
</script><script src="../../ios-duo/mockups/icons.js"></script><script src="art.js"></script></body></html>
